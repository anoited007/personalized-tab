name: Release

# Uses the repo's own Makefile for every step, so `make build|zip|upload|publish`
# behaves identically here and on your machine.
#
# - Pushing a `v*` tag builds, zips, and uploads a new DRAFT to the Chrome Web
#   Store (does not go live) and attaches the zip to a GitHub Release.
# - Actually publishing that draft live is a separate, manual step: run this
#   workflow via "Run workflow" with `publish` checked.
#
# Requires these repository secrets (see README's "Publishing" section for
# how to obtain them): CHROME_EXTENSION_ID, CHROME_CLIENT_ID,
# CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish the upload live on the Chrome Web Store'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and zip
        run: make zip

      - name: Upload draft to Chrome Web Store
        run: make upload

      - name: Publish live
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: make publish

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.zip
