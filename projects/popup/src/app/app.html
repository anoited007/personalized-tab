<main class="popup">
  <div class="glass-shell">
    <div class="glass-core pad">
      <p class="popup-title">Personalized New Tab</p>
      <div class="popup-actions">
        <button type="button" class="btn btn-primary" (click)="openNewTab()">
          Open new tab
          <span class="btn-icon mono">↗</span>
        </button>
        <button type="button" class="btn" (click)="openSettings()">
          Settings
          <span class="btn-icon mono">⚙</span>
        </button>
      </div>
    </div>
  </div>
</main>
